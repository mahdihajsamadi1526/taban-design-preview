name: publish-etemad
# Publishes etemad-fund-sim.html from a one-off hub link; the file is accepted only if its SHA-256 matches.
on:
  push:
    paths: ['.github/workflows/publish-etemad.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
env:
  SRC_URL: https://paris-pathology-city-null.trycloudflare.com/k7f3q9x2m8w4c1v6b5n0/etemad-fund-sim.html
  SHA256: 1d6d44473cf31bb4bfbecdda9ef3c8005c65a93d2413f0235f3ce2c2563de975
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and verify
        run: |
          curl -sSfL --retry 4 --retry-delay 5 -o etemad-fund-sim.html "$SRC_URL"
          echo "$SHA256  etemad-fund-sim.html" | sha256sum -c -
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etemad-fund-sim.html
          git diff --cached --quiet || git commit -m "Publish etemad-fund-sim.html (v1.1: full market watch, 3715 symbols, favicon)"
          git push
      - name: pages build
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ github.token }}
