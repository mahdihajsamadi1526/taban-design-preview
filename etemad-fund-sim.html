:root{
--navy:#0C2C47;--navy2:#1D4466;--navy3:#33597D;--ink:#14202B;--muted:#5D6B7A;--line:#E3E8EE;--line2:#EEF1F5;
--bg:#F3F5F8;--card:rgba(255,255,255,.78);--card2:#fff;--green:#0F7B55;--green-bg:#E6F4EE;--red:#C2372F;--red-bg:#FBEBEA;
--amber:#B7791F;--amber-bg:#FDF4E3;--blue-bg:#EAF0F7;--r:14px;--sh:0 1px 2px rgba(12,44,71,.05),0 8px 24px rgba(12,44,71,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;
background-image:radial-gradient(1200px 500px at 85% -10%,rgba(29,68,102,.10),transparent 60%),radial-gradient(900px 400px at 0% 110%,rgba(15,123,85,.06),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
a{color:var(--navy2)}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-feature-settings:"tnum"}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--muted)}
.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0C2C47,#102F4C 60%,#0E2A44);color:#DCE6F0;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px 24px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fff,#C9D7E6);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:17px}
.brand .t1{font-weight:800;color:#fff;font-size:15px;line-height:1.3}.brand .t2{font-size:11px;color:#9FB3C8;direction:ltr;text-align:right}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:#C9D6E3;text-decoration:none;font-size:13.5px;margin:2px 0;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #7FB3E0}
.nav .ix{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:11px;flex:none}
.side .foot{margin-top:16px;padding:10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:11.5px;color:#A9BBCD;line-height:1.8}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 22px;background:rgba(243,245,248,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:800;font-size:17px;color:var(--navy);margin-left:auto}
.top select{min-width:150px}
.burger{display:none;border:0;background:var(--navy);color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.status{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;background:#fff;border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA7B4;display:inline-block}
.dot.g{background:#19A974}.dot.a{background:#E0A526}.dot.r{background:#D9473F}.dot.b{background:#3C7CC0}
.content{padding:18px 22px 40px;max-width:1500px;width:100%}
.banner{border-radius:12px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;display:block;border:1px solid}
.banner.warn{background:var(--amber-bg);border-color:#F1D9A8;color:#6B4A0F}
.banner.info{background:var(--blue-bg);border-color:#CFDDEC;color:#173B5E}
.banner.ok{background:var(--green-bg);border-color:#BFE3D2;color:#0B5A3E}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.s2{grid-column:span 2}.s3{grid-column:span 3}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(12,44,71,.08);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14.5px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:800;color:var(--navy);line-height:1.5}.kpi .s{font-size:12px}
.tag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;background:var(--line2);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.need{background:#FFF1E0;color:#9A5B00;border:1px dashed #E7B36B}
.tag.sample{background:#EEF2F7;color:#40576E}
.tag.live{background:var(--green-bg);color:var(--green)}
.tag.sim{background:#F3ECFB;color:#5B3A8A}
.tag.red{background:var(--red-bg);color:var(--red)}.tag.green{background:var(--green-bg);color:var(--green)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--navy);white-space:nowrap}
.btn:hover{border-color:#B9C6D4}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.p:hover{background:var(--navy2)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}.btn.r{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],input[type=url],select,textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;min-width:0;outline:none}
input:focus,select:focus{border-color:#7FA3C6;box-shadow:0 0 0 3px rgba(60,124,192,.12)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select{width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.seg.bs button.on.buy{background:var(--green)}.seg.bs button.on.sell{background:var(--red)}
.tw{overflow:auto;border-radius:10px;border:1px solid var(--line2);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{position:sticky;top:0;background:#F6F8FB;color:var(--navy);font-weight:700;text-align:right;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
table.t th.srt{cursor:pointer}table.t th.srt:hover{background:#EDF2F7}
table.t td{padding:6px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t tr:hover td{background:#FAFBFD}
table.t tfoot td{font-weight:700;background:#F6F8FB}
table.t tr.clk{cursor:pointer}
.tw.h360{max-height:360px}.tw.h480{max-height:480px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:rgba(12,44,71,.94);color:#fff;font-size:11.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;z-index:5;display:none;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:middle}
.bar{height:8px;border-radius:6px;background:var(--line2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--navy2);border-radius:6px}
.alerts .al{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.alerts .al:last-child{border:0}
.sev{flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px}.sev.h{background:var(--red)}.sev.m{background:#E0A526}.sev.l{background:#3C7CC0}
.book{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.book table td{padding:3px 6px}
.fundcard{border-top:4px solid var(--navy2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;bottom:18px;left:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--navy);color:#fff;padding:9px 14px;border-radius:10px;box-shadow:var(--sh);font-size:13px;max-width:360px}
.toast div.err{background:var(--red)}.toast div.ok{background:var(--green)}
.modal{position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:90;display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px;color:var(--navy)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--navy);border-color:var(--navy)}
.formula{font-family:inherit;background:#F7F9FC;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:2}
.formula code{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Consolas,monospace;font-size:12px;color:var(--navy2)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.ro{font-size:12px;color:var(--muted)}
.hide{display:none!important}
.printonly{display:none}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
.app{grid-template-columns:1fr}
.side{position:fixed;right:0;top:0;width:270px;z-index:60;transform:translateX(105%);transition:transform .2s}
.side.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
.burger{display:inline-block}
.content{padding:12px 12px 30px}
.top{padding:8px 12px}
.top .ttl{font-size:15px}
.g2,.g3,.g4{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.s2,.s3{grid-column:auto}
.kpi .v{font-size:17px}
.book{grid-template-columns:1fr}
.top select{min-width:0;max-width:44vw}
}
@media print{
